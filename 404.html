<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ambulkar Cortex | Redirecting...</title>
    <script>
        // Single Page App (SPA) Redirect for GitHub Pages
        (function() {
            var pathSegments = window.location.pathname.split('/');
            var lastSegment = pathSegments[pathSegments.length - 1];
            var queryStr = window.location.search;
            
            // Redirect to index.html with subpath encoded as parameter
            if (window.location.pathname.includes('/status/')) {
                window.location.replace('/?status=' + encodeURIComponent(lastSegment));
            } else if (window.location.pathname.includes('/thread/')) {
                window.location.replace('/?thread=' + encodeURIComponent(lastSegment));
            } else {
                window.location.replace('/' + queryStr);
            }
        })();
    </script>
</head>
<body style="background: #0b0f19; color: #38bdf8; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2 style="margin-bottom: 10px;">⚡ Ambulkar Cortex Routing...</h2>
        <p style="color: #cbd5e1; font-size: 0.9rem;">Redirecting to live research workspace...</p>
    </div>
</body>
</html>
