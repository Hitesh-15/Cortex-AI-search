name: Cortex 24/7 Google Alerts Watchdog

on:
  schedule:
    # Runs daily at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub web/mobile!

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cortex 24/7 Autonomous Alerts Bot
        env:
          CORTEX_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python cortex_bot.py
