name: Cortex 24/7 Stateful Watchdog & Smart Money 50 Radar

on:
  schedule:
    # Runs daily at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub web/mobile!

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Stateful Monitor Snapshots & Deduplication Cache
        uses: actions/cache@v4
        with:
          path: briefs/monitor_state.json
          key: cortex-monitor-state-${{ github.run_id }}
          restore-keys: |
            cortex-monitor-state-

      - name: Run Cortex Stateful Page-Diff & 50-Site Smart Money Radar
        env:
          CORTEX_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python cortex_bot.py
